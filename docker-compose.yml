services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: funnel
      POSTGRES_DB: funnel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funnel"]
      interval: 2s
      retries: 15

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://funnel:funnel@db:5432/funnel
    ports: ["8000:8000"]
    volumes: [./config:/app/config:ro]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
