services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: funnel
      POSTGRES_PASSWORD: funnel
      POSTGRES_DB: funnel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funnel"]
      interval: 2s
      retries: 15

  # Mini App требует https. Quick tunnel даёт временный адрес *.trycloudflare.com без аккаунта.
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    # http2 вместо QUIC: UDP часто режут VPN и корпоративные сети.
    command: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:2000 --url http://bot:8000
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://funnel:funnel@db:5432/funnel
      CLOUDFLARED_METRICS: http://tunnel:2000
    ports: ["8000:8000"]
    volumes: [./config:/app/config:ro]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
