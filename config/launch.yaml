# Один файл = один запуск (эфир). Код общий, под новый эфир копируется только этот конфиг.
# Плейсхолдеры в текстах: {name}, {ticket}, {tickets}, {ref_link}. Разметка HTML.
# Ссылки на example.com - заглушки, перед реальным запуском заменить на свои.

launch:
  name: "Демо-эфир: AI-агент за вечер"
  # Описание бота, которое человек видит до /start. Согласие на обработку ПД - здесь,
  # ссылка должна вести на политику того, кто реально хранит данные.
  description: |
    Демо-эфир «AI-агент за вечер»: разберём, как собрать первого агента и где он экономит время.

    Нажимая «Старт», вы соглашаетесь с обработкой персональных данных: https://example.com/privacy

texts:
  welcome: |
    <b>{name}, добро пожаловать!</b>

    Скоро бесплатный эфир «AI-агент за вечер». За час соберём рабочего агента вместе с вами.
  ask_phone: |
    Последний шаг: поделитесь контактом кнопкой ниже.

    Так мы убедимся, что вы не бот, и пришлём ссылку на эфир, материалы и напоминание перед началом.
  phone_button: "Поделиться контактом"
  wrong_contact: "Нужен именно ваш контакт: нажмите кнопку ниже."
  thanks: "Готово ✅ Вы в списке участников."
  already_registered: "{name}, вы уже записаны. Номер участника: {ticket}."
  referral_bonus: "Ваш друг записался по вашей ссылке. Номеров в розыгрыше: {tickets} 🎟"

# Отсчёт задержки - от момента, когда человек оставил телефон.
messages:
  - key: program
    delay_seconds: 10
    text: |
      <b>Что будет на эфире</b>

      1. Где AI-агент окупается быстрее всего: три сценария из практики.
      2. Собираем агента в прямом эфире, вы повторяете за нами.
      3. Как показать результат заказчику или руководителю.
    buttons:
      - text: "Канал с анонсами"
        url: "https://example.com/channel"
      - text: "🎁 Материалы к эфиру"
        url: "https://example.com/materials"

  - key: ticket
    delay_seconds: 60
    text: |
      🎟 <b>Ваш номер в розыгрыше: {ticket}</b>

      Пригласите друга: когда он запишется по вашей ссылке и оставит контакт, вы получите ещё один номер.

      Номеров сейчас: {tickets}
      Ваша ссылка: {ref_link}
    share_button: "🎟 Пригласить друга"

# Дожим тех, кто нажал /start, но не оставил контакт. Отсчёт от /start. Убрать блок - дожима не будет.
nudge:
  delay_seconds: 120
  text: |
    {name}, вы почти записаны. Остался один шаг: кнопка «Поделиться контактом».
